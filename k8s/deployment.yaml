apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-codeguardian-backend
  namespace: ai-codeguardian
  labels:
    app: ai-codeguardian-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-codeguardian-backend
  template:
    metadata:
      labels:
        app: ai-codeguardian-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: ai-codeguardian/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: codeguardian-config
            - secretRef:
                name: codeguardian-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
