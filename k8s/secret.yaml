apiVersion: v1
kind: Secret
metadata:
  name: codeguardian-secrets
  namespace: ai-codeguardian
type: Opaque
stringData:
  DATABASE_URL: "postgresql://guardian_user:guardian_prod_password@postgres-service:5432/codeguardian_prod"
  REDIS_URL: "redis://redis-service:6379/0"
  API_KEY: "prod-secret-api-key-change-me"
  GITLAB_WEBHOOK_SECRET: "prod-gitlab-webhook-secret-change-me"
